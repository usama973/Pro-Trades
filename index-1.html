<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRO TRADES • Secure Login</title>
<style>
body{margin:0;background:#05070f;color:#e8f0ff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}
.box{width:min(420px,90%);padding:28px;background:#0b1220;border:1px solid #1a2740;border-radius:20px;box-shadow:0 0 35px #00f0ff22}
.logo{font-size:26px;font-weight:900;color:#00f0ff}.muted{color:#7a8ba8;font-size:13px}input,button{width:100%;padding:13px;margin-top:10px;border-radius:10px;box-sizing:border-box}input{background:#07101d;border:1px solid #263752;color:white}button{border:0;background:#00f0ff;font-weight:800;cursor:pointer}.hidden{display:none}.msg{margin-top:12px;font-size:13px}.ok{color:#00ff9d}.err{color:#ff3b5c}
</style></head><body>
<div class="box"><div class="logo">PRO TRADES</div><p class="muted">Secure OTP access</p>
<div id="phoneBox"><input id="phone" placeholder="+923001234567" autocomplete="tel"><div id="recaptcha"></div><button id="send">SEND OTP</button></div>
<div id="otpBox" class="hidden"><input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button id="verify">VERIFY & OPEN</button></div>
<div id="msg" class="msg"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,RecaptchaVerifier,signInWithPhoneNumber} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const firebaseConfig={
 apiKey:"PASTE_FIREBASE_WEB_API_KEY",authDomain:"PASTE_PROJECT.firebaseapp.com",
 projectId:"PASTE_PROJECT_ID",storageBucket:"PASTE_PROJECT.firebasestorage.app",
 messagingSenderId:"PASTE_MESSAGING_SENDER_ID",appId:"PASTE_APP_ID"};
const app=initializeApp(firebaseConfig),auth=getAuth(app);
const msg=t=>document.getElementById("msg").textContent=t;
window.recaptchaVerifier=new RecaptchaVerifier(auth,"recaptcha",{size:"invisible"});
document.getElementById("send").onclick=async()=>{
 try{const n=document.getElementById("phone").value.trim();if(!n)throw Error("Enter phone number");
 window.confirmationResult=await signInWithPhoneNumber(auth,n,window.recaptchaVerifier);
 document.getElementById("phoneBox").classList.add("hidden");document.getElementById("otpBox").classList.remove("hidden");msg("OTP sent.");}
 catch(e){msg(e.message||"Could not send OTP.");}
};
document.getElementById("verify").onclick=async()=>{
 try{await window.confirmationResult.confirm(document.getElementById("otp").value.trim());location.href="dashboard.html";}
 catch(e){msg("Invalid or expired OTP.");}
};
</script></body></html>
